<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">PLuG attention overview</title>
  <desc id="desc">Standard attention logits and a parallel pairwise gating path are combined before softmax and value aggregation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16355f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#356fd3"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#159c83"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#17345f">Pairwise Logit Gating (PLuG)</text>
  <text x="700" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#5d708e">Learnable token-pair modulation before softmax</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="55" y="245" width="150" height="92" rx="18" fill="#ffffff" stroke="#9fb6dc" stroke-width="2"/>
    <text x="130" y="283" text-anchor="middle" font-size="25" font-weight="700" fill="#17345f">Input</text>
    <text x="130" y="313" text-anchor="middle" font-size="17" fill="#657895">tokens X</text>

    <rect x="300" y="150" width="245" height="112" rx="18" fill="#e9f1ff" stroke="#5f8fe2" stroke-width="2"/>
    <text x="422.5" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#2458ad">Attention Path</text>
    <text x="422.5" y="224" text-anchor="middle" font-size="19" fill="#17345f">QKᵀ / √d</text>
    <text x="422.5" y="248" text-anchor="middle" font-size="15" fill="#657895">attention logits A</text>

    <rect x="300" y="352" width="245" height="126" rx="18" fill="#e8faf5" stroke="#42aa93" stroke-width="2"/>
    <text x="422.5" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#137d69">Gating Path</text>
    <text x="422.5" y="424" text-anchor="middle" font-size="18" fill="#17345f">Q<tspan baseline-shift="sub" font-size="13">g</tspan>K<tspan baseline-shift="sub" font-size="13">g</tspan>ᵀ → GML</text>
    <text x="422.5" y="454" text-anchor="middle" font-size="15" fill="#657895">pairwise gate G ∈ [−1, 1]</text>

    <rect x="655" y="225" width="270" height="132" rx="22" fill="#ffffff" stroke="#6d7f9c" stroke-width="2.5"/>
    <text x="790" y="266" text-anchor="middle" font-size="21" font-weight="700" fill="#17345f">Logit Modulation</text>
    <text x="790" y="307" text-anchor="middle" font-size="25" font-weight="700" fill="#6b4bc3">A ⊙ (1 + G)</text>
    <text x="790" y="336" text-anchor="middle" font-size="15" fill="#657895">amplify or suppress each pair</text>

    <rect x="1032" y="245" width="150" height="92" rx="18" fill="#f3edff" stroke="#9476d8" stroke-width="2"/>
    <text x="1107" y="284" text-anchor="middle" font-size="22" font-weight="700" fill="#6542af">Softmax</text>
    <text x="1107" y="313" text-anchor="middle" font-size="16" fill="#657895">attention weights</text>

    <rect x="1247" y="245" width="110" height="92" rx="18" fill="#ffffff" stroke="#9fb6dc" stroke-width="2"/>
    <text x="1302" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#17345f">× V</text>
    <text x="1302" y="313" text-anchor="middle" font-size="16" fill="#657895">output</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M205 278 C250 278 250 206 298 206" stroke="#356fd3" marker-end="url(#arrow-blue)"/>
    <path d="M205 304 C250 304 250 415 298 415" stroke="#159c83" marker-end="url(#arrow-green)"/>
    <path d="M545 206 C605 206 603 260 653 273" stroke="#356fd3" marker-end="url(#arrow-blue)"/>
    <path d="M545 415 C605 415 603 323 653 308" stroke="#159c83" marker-end="url(#arrow-green)"/>
    <path d="M925 291 L1030 291" stroke="#6b4bc3" marker-end="url(#arrow-blue)"/>
    <path d="M1182 291 L1245 291" stroke="#356fd3" marker-end="url(#arrow-blue)"/>
  </g>

</svg>
